<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login Gateway</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <button id="theme-toggle-btn" class="btn-theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
    <canvas id="network-canvas"></canvas>
    <div class="auth-viewport-wrapper">
        <div class="auth-container">
            <h2>Login In</h2>
            <div class="role-badge admin-badge">System Administrator</div>
            <form id="admin-login-form">
               <div class="input-group"><label>System Root Email</label><input type="email" id="a-login-email" required placeholder="admin@mes.ac.in"></div>
               <div class="input-group"><label>Password</label><input type="password" id="a-login-pass" required placeholder="••••••••"></div>
                <button type="submit" class="btn-submit admin-btn">Authorize System Elevate</button>
            </form>
            <p class="toggle-text">First installation context? <a href="signup-admin.html">Register</a></p>
            <p class="toggle-text"><a href="index.html">← Alternate Portal Roles</a></p>
        </div>
    </div>
    <script>
    const BASE_URL = 'http://127.0.0.1:5000';
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.querySelector('#admin-login-form input[type="email"]').value;
        const password = document.querySelector('#admin-login-form input[type="password"]').value;

        try {
            const res = await fetch(`${BASE_URL}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.accessToken && data.role === 'ADMIN') {
                localStorage.setItem('authToken', data.accessToken);
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userRole', data.role);
                window.location.href = 'dashboard.html';
            } else {
                alert(data.error || 'Login failed. Make sure you are an admin.');
            }
        } catch (err) {
            alert('Server unreachable. Please try again.');
        }
    });
   </script>
    <script src="js/bg-garden.js"></script>
</body>
</html>
