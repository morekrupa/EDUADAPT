<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdapt - Standing Matrix</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/leaderboard.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <canvas id="network-canvas"></canvas>
    <div class="rank-wrapper">
        <h3>Classroom Peer Standings</h3>
        <div class="leaderboard-card" id="leaderboard-list">
            Loading...
        </div>

        <h3>My Progress</h3>
        <div id="progress-list">Loading...</div>
    </div>

    <footer class="nav-footer">
        <a href="dashboard.html" class="nav-btn">🗺️ Path</a>
        <a href="leaderboard.html" class="nav-btn active">🏆 Ranks</a>
        <a href="profile.html" class="nav-btn">👤 Profile</a>
    </footer>

    <script>
        const token = localStorage.getItem('authToken');
        const userId = localStorage.getItem('userId');
        const BASE_URL = 'http://127.0.0.1:5000';

        if (!token) { window.location.href = 'login-student.html'; }

        const medals = ['🥇', '🥈', '🥉'];

        // Load real progress for this student
        fetch(`${BASE_URL}/api/students/${userId}/progress`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('progress-list');
            if (!data.progress || data.progress.length === 0) {
                list.innerHTML = '<p>No progress yet — play some games!</p>';
                return;
            }
            list.innerHTML = data.progress.map(p => `
                <div class="rank-row">
                    <span>${p.lesson.title}</span>
                    <span class="points">
                        Mastery: ${Math.round(p.masteryScore)}% 
                        (${p.attempts} attempts)
                    </span>
                </div>
            `).join('');
        })
        .catch(err => {
            console.error('Failed to load progress:', err);
            document.getElementById('progress-list').innerHTML = 
                '<p>Failed to load progress.</p>';
        });

        // Load courses to get leaderboard
        fetch(`${BASE_URL}/api/courses`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('leaderboard-list');
            if (!data.courses || data.courses.length === 0) {
                list.innerHTML = '<p>No courses available yet.</p>';
                return;
            }
            // Show course names as sections
            list.innerHTML = data.courses.map(course => `
                <div class="rank-row podium">
                    📚 ${course.title}
                    <span class="points">
                        Teacher: ${course.teacher.name}
                    </span>
                </div>
            `).join('');
        })
        .catch(err => {
            console.error('Failed to load leaderboard:', err);
            document.getElementById('leaderboard-list').innerHTML = 
                '<p>Failed to load leaderboard.</p>';
        });
    </script>
    <script src="js/bg-garden.js"></script>
</body>
</html>
