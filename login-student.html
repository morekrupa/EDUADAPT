<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdapt - Student Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <button id="theme-toggle-btn" class="btn-theme-toggle" onclick="toggleTheme()">🌙 DARK</button>

    <div class="auth-viewport-wrapper">
        <div class="auth-container">
            <h2>STUDENT LOGIN</h2>
            <div class="role-badge">STUDENT PORTAL</div>
            <form onsubmit="handleStudentLogin(event)">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="student@student.mes.ac.in">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-pixel btn-gold">AUTHENTICATE ENTRY</button>
                
                <div class="divider">- OR -</div>
                <button type="button" class="btn-pixel btn-google" onclick="handleGoogleLogin()">🌐 GOOGLE SIGN IN</button>
            </form>
            <p class="toggle-text"><a href="signup-student.html">Create Student Account</a></p>
            <p class="toggle-text"><a href="index.html">← Alternate Roles</a></p>
        </div>
    </div>

    <script src="js/login-student.js"></script>
    <script src="js/bg-garden.js"></script>
</body>
</html>
