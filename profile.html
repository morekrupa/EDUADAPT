<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAdapt - Configuration Terminal</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <canvas id="network-canvas"></canvas>
    <header class="profile-header">
        <div class="avatar-container">
            <div class="avatar-placeholder">🎓</div>
        </div>
        <h2 id="prof-name">Loading...</h2>
        <p id="prof-email">Loading...</p>
        <p id="prof-role"></p>
    </header>

    <main class="profile-viewport">
        <section class="info-group">
            <h3>System Mode Config</h3>
            <div class="info-row">
                <span class="label">System Interface Theme:</span>
                <button id="theme-toggle-btn" class="btn-theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            </div>
        </section>

        <section class="info-group">
            <h3>Academic Vector Profiles</h3>
            <div class="info-row">
                <span class="label">Campus:</span>
                <span class="value">Pillai College of Engineering</span>
            </div>
            <div class="info-row">
                <span class="label">Major Specialty:</span>
                <span class="value">Computer Engineering (AI/DS)</span>
            </div>
        </section>

        <section class="info-group">
            <h3>My Badges</h3>
            <div id="badges-list">Loading...</div>
        </section>

        <button id="logout-btn" class="btn-logout">De-authenticate & Clear Sessions</button>
    </main>

    <footer class="nav-footer">
        <a href="dashboard.html" class="nav-btn">🗺️ Path</a>
        <a href="leaderboard.html" class="nav-btn">🏆 Ranks</a>
        <a href="profile.html" class="nav-btn active">👤 Profile</a>
    </footer>

    <script>
        const token = localStorage.getItem('authToken');
        const userId = localStorage.getItem('userId');
        const BASE_URL = 'http://127.0.0.1:5000';

        if (!token) { window.location.href = 'login-student.html'; }

        // Load real profile
        fetch(`${BASE_URL}/api/users/me`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(res => res.json())
        .then(data => {
            if (data.user) {
                document.getElementById('prof-name').innerText = data.user.name;
                document.getElementById('prof-email').innerText = data.user.email;
                document.getElementById('prof-role').innerText = data.user.role;
            } else {
                localStorage.removeItem('authToken');
                window.location.href = 'login-student.html';
            }
        })
        .catch(err => console.error('Failed to load profile:', err));

        // Load real badges
        // Badges come back from game session responses as newBadges
        // For now show a placeholder message
        document.getElementById('badges-list').innerHTML = 
            '<p>Play games to earn badges!</p>';

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userId');
            localStorage.removeItem('userRole');
            window.location.href = 'index.html';
        });
    </script>
    <script src="js/bg-garden.js"></script>
</body>
</html>
